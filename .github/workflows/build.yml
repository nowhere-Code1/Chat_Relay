name: Build ChatRelay
on:
  workflow_dispatch:
    inputs:
      host:
        description: "Bot host name (no https://)"
        default: "tiktok-bot-3ayj.onrender.com"
  push:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: |
          HOST="${{ github.event.inputs.host }}"
          if [ -z "$HOST" ]; then HOST="tiktok-bot-3ayj.onrender.com"; fi
          NDK="${ANDROID_NDK_LATEST_HOME:-$ANDROID_NDK_ROOT}"
          cmake -S . -B build -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE="$NDK/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a -DANDROID_PLATFORM=android-28 -DANDROID_STL=c++_static \
            -DCMAKE_BUILD_TYPE=Release -DRELAY_HOST="$HOST"
          cmake --build build
          mkdir -p pack/chat_relay
          cp build/libchat_relay.so manifest.json icon.png pack/chat_relay/
          cd pack && zip -r ../ChatRelay.levipack chat_relay
      - uses: actions/upload-artifact@v4
        with:
          name: ChatRelay
          path: ChatRelay.levipack
